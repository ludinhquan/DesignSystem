name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  verify:
    name: Format, analyze, token check, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies (whole workspace)
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Check generated tokens are up to date
        run: dart run tool/gen_tokens.dart --check

      - name: Analyze
        run: flutter analyze .

      - name: Test (unit, widget, golden)
        run: dart run melos run test --no-select

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: packages/**/test/**/failures/
          if-no-files-found: ignore

  widgetbook:
    name: Build Widgetbook (web)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build
        working-directory: apps/widgetbook
        run: flutter build web --release

      - uses: actions/upload-artifact@v4
        with:
          name: widgetbook-web
          path: apps/widgetbook/build/web
