name: ds
description: >-
  The design system: hand-written tokens, a Material theme built from a
  DsBrand, and Ds* components. Depends only on Flutter and material_ui.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0

dev_dependencies:
  alchemist: ^0.14.0
  flutter_test:
    sdk: flutter

flutter:
  # Material icons font, used by components, previews and goldens.
  uses-material-design: true
