name: ds_components
description: >-
  Design-system widgets (AppButton, AppCard, ...) that read only from
  semantic/component tokens via ds_foundation.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  ds_foundation: ^0.1.0
  ds_tokens: ^0.1.0
  flutter:
    sdk: flutter
  material_ui: ^1.5.0

dev_dependencies:
  alchemist: ^0.14.0
  flutter_test:
    sdk: flutter

flutter:
  # Needed for Icons in tests/goldens (alchemist also requests it).
  uses-material-design: true
