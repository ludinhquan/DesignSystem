name: design_system_workspace
description: Workspace root for the Flutter design system monorepo.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/ds_tokens
  - packages/ds_foundation
  - packages/ds_components
  - apps/example
  - apps/widgetbook

dev_dependencies:
  flutter_lints: ^6.0.0
  melos: ^7.8.2

melos:
  repository: https://github.com/ludinhquan/DesignSystem
  scripts:
    analyze:
      description: Run static analysis across the whole workspace.
      run: flutter analyze .
    test:
      description: Run widget, unit and golden tests in every package that has a test/ folder.
      run: dart run melos exec --dir-exists=test --concurrency=1 -- flutter test
    test:update-goldens:
      description: Regenerate alchemist golden files (review the diff before committing!).
      run: >-
        dart run melos exec --dir-exists=test/goldens --concurrency=1 --
        flutter test --update-goldens --tags golden
    gen-tokens:
      description: Regenerate packages/ds_tokens from tokens/*.json.
      run: dart run tool/gen_tokens.dart
    gen-tokens:check:
      description: Fail if packages/ds_tokens is stale relative to tokens/*.json.
      run: dart run tool/gen_tokens.dart --check
    format:
      description: Format all Dart code.
      run: dart format .
    format:check:
      description: Fail if any Dart file is not formatted.
      run: dart format --output=none --set-exit-if-changed .
