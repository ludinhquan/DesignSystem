name: app
description: >-
  The one Flutter app. Every brand is a flavor of it; the environment comes
  from a --dart-define-from-file JSON in config/.
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  dio: ^5.11.1
  ds:
    path: ../packages/ds
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.2
  material_ui: ^1.5.0
  sentry_flutter: ^9.30.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
