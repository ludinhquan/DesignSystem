# Shared lint rules for every package and app in the workspace.
# Packages/apps include this file and may add stricter rules.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
  exclude:
    - "**/build/**"
    - "**/.dart_tool/**"
    - "apps/*/android/**"
    - "apps/*/ios/**"
    - "apps/*/web/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - use_super_parameters
